name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:bots -- 30
      - run: npm run build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: game image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: game
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voxel-tactical-game:latest
      - name: proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxy
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/voxel-tactical-proxy:latest
