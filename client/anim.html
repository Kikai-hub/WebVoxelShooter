<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стенд анимаций</title>
    <style>
      html, body { margin: 0; height: 100%; background: #9fd0f0; overflow: hidden; font: 13px system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); }
      #ui button { background: rgba(20, 22, 26, 0.75); color: #eee; border: 1px solid #555; padding: 6px 10px; cursor: pointer; }
      #ui button.on { border-color: #f0b545; color: #f0b545; }
      #hint { position: fixed; left: 12px; bottom: 10px; color: #123; }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="hint">Стенд анимаций агентов (только для разработки). Мышь — вращать камеру, колесо — приблизить.</div>
    <!-- ?vm=1 — оружие от первого лица (перезарядка, доставание, нож), иначе — агенты от третьего лица -->
    <script type="module">
      if (new URLSearchParams(location.search).has('vm')) {
        document.getElementById('hint').textContent = 'Оружие от первого лица. R — перезарядка, F — осмотр, клик/пробел — выстрел или удар. Ползунок — замороженный кадр.';
        import('/src/vmLab.ts');
      } else import('/src/animLab.ts');
    </script>
  </body>
</html>
