# Разработка: горячая перезагрузка клиента и сервера, без TLS.
# docker compose -f docker-compose.dev.yml up   →   http://localhost:5173
services:
  dev:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_HOST: 0.0.0.0
      GAME_ADDR: 127.0.0.1:8080
      DATA_DIR: /app/data
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  dev_node_modules:
